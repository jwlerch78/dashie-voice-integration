name: Bug report
description: Something in the Dashie Voice integration isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! If the problem is in the **add-on** (engine routing,
        model errors, add-on won't start), please file it at
        [dashie-ha-console](https://github.com/jwlerch78/dashie-ha-console/issues) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you say/do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.7.1
    validations:
      required: true
  - type: input
    id: dashie-voice-version
    attributes:
      label: Dashie Voice integration version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Dashie for Home Assistant add-on version
      placeholder: e.g. 0.2.0 (Settings → Add-ons → Dashie for Home Assistant)
  - type: input
    id: satellite
    attributes:
      label: Satellite / how you talk to it
      placeholder: e.g. Voice PE, ESPHome satellite, browser Assist dialog, tablet
  - type: textarea
    id: pipeline
    attributes:
      label: Pipeline setup
      description: Which stages use Dashie Voice (conversation / STT / TTS) and what engines the add-on is pointed at (no keys!).
      placeholder: |
        conversation: Dashie Voice → Ollama qwen2.5:7b on LAN box
        stt: Dashie Voice → faster-whisper on LAN box
        tts: Piper (HA add-on)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from Settings → System → Logs (filter "dashie_voice") and the
        add-on log (look for DASHIE-TURN / DASHIE-STT / DASHIE-TTS / DROP markers).
        Redact anything sensitive.
      render: text
